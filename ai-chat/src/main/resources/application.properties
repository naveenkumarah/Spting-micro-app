# Azure OpenAI configuration for Spring AI
spring.ai.azure.openai.api-key=YOUR_AZURE_OPENAI_API_KEY
spring.ai.azure.openai.endpoint=https://YOUR_RESOURCE_NAME.openai.azure.com/
spring.ai.azure.openai.deployment-id=YOUR_DEPLOYMENT_ID
spring.ai.azure.openai.model=gpt-35-turbo

# OAuth2 Resource Server (JWT) configuration
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9000/oauth2/jwks

# OAuth2 Client configuration for browser-based login via identity provider
spring.security.oauth2.client.registration.ai-chat-client.client-id=ai-chat-client
spring.security.oauth2.client.registration.ai-chat-client.client-secret=secret
spring.security.oauth2.client.registration.ai-chat-client.scope=openid,profile,chat
spring.security.oauth2.client.registration.ai-chat-client.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.ai-chat-client.redirect-uri={baseUrl}/login/oauth2/code/ai-chat-client
spring.security.oauth2.client.registration.ai-chat-client.provider=identity-provider

spring.security.oauth2.client.provider.identity-provider.authorization-uri=http://localhost:9000/oauth2/authorize
spring.security.oauth2.client.provider.identity-provider.token-uri=http://localhost:9000/oauth2/token
spring.security.oauth2.client.provider.identity-provider.user-info-uri=http://localhost:9000/userinfo
spring.security.oauth2.client.provider.identity-provider.jwk-set-uri=http://localhost:9000/oauth2/jwks
